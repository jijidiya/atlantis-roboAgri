components:
  schemas:
    Culture:
      type: object
      properties:
        culture_id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 100
        variete:
          type: string
          nullable: true
          maxLength: 100
      required:
      - culture_id
      - nom
    Decision:
      type: object
      properties:
        decision_id:
          type: integer
          readOnly: true
        zone:
          type: integer
          readOnly: true
        type_decision:
          allOf:
          - $ref: '#/components/schemas/TypeDecisionEnum'
          readOnly: true
        action:
          type: string
          readOnly: true
        justification:
          type: string
          readOnly: true
          nullable: true
        humidite_moyenne:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        seuil_min_applique:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        seuil_max_applique:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        statut:
          allOf:
          - $ref: '#/components/schemas/DecisionStatutEnum'
          readOnly: true
        date_decision:
