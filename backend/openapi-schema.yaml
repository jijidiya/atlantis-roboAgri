          description: ''
components:
  schemas:
    Connexion:
      type: object
      properties:
        email:
          type: string
          format: email
        nom_utilisateur:
          type: string
          format: email
        mot_de_passe:
          type: string
          writeOnly: true
      required:
      - mot_de_passe
    Culture:
      type: object
      properties:
        culture_id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 100
        variete:
          type: string
          nullable: true
          maxLength: 100
      required:
      - culture_id
      - nom
    Decision:
      type: object
      properties:
        decision_id:
          type: integer
          readOnly: true
        zone:
          type: integer
          readOnly: true
        type_decision:
          allOf:
          - $ref: '#/components/schemas/TypeDecisionEnum'
          readOnly: true
        action:
          type: string
          readOnly: true
        justification:
          type: string
          readOnly: true
          nullable: true
        humidite_moyenne:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        seuil_min_applique:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        seuil_max_applique:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        statut:
          allOf:
          - $ref: '#/components/schemas/DecisionStatutEnum'
          readOnly: true
        date_decision:
          type: string
          format: date-time
          readOnly: true
        analyse:
          type: integer
          readOnly: true
      required:
      - action
      - analyse
      - date_decision
      - decision_id
      - humidite_moyenne
      - justification
      - seuil_max_applique
      - seuil_min_applique
      - statut
      - type_decision
      - zone
    DecisionStatutEnum:
      enum:
      - recommandee
      - autorisee
      - refusee
      type: string
      description: |-
        * `recommandee` - Recommandée
        * `autorisee` - Autorisée
        * `refusee` - Refusée
    Etape:
      type: object
      properties:
        etape_id:
          type: integer
          readOnly: true
        numero_ordre:
          type: integer
          minimum: 1
        zone:
          type: integer
        statut:
          allOf:
          - $ref: '#/components/schemas/Statut4b1Enum'
          readOnly: true
        date_debut:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        date_fin:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_debut
      - date_fin
      - etape_id
      - numero_ordre
      - statut
      - zone
    Incident:
      type: object
      properties:
        incident_id:
          type: integer
          readOnly: true
        type_incident:
          allOf:
          - $ref: '#/components/schemas/TypeIncidentEnum'
          readOnly: true
        date_incident:
          type: string
          format: date-time
          readOnly: true
        mission:
          type: integer
          readOnly: true
          nullable: true
        mesures:
          type: array
          items:
            type: integer
          readOnly: true
      required:
      - date_incident
      - incident_id
      - mesures
      - mission
      - type_incident
    Irrigation:
      type: object
      properties:
        irrigation_id:
          type: integer
          readOnly: true
        zone:
          type: integer
          readOnly: true
        automatique:
          type: boolean
          readOnly: true
        statut:
          allOf:
          - $ref: '#/components/schemas/Statut4b1Enum'
          readOnly: true
        duree_secondes:
          type: integer
          readOnly: true
        volume_ml:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        date_debut:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        date_fin:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        decision:
          type: integer
          readOnly: true
          nullable: true
        utilisateur:
          type: integer
          readOnly: true
          nullable: true
      required:
      - automatique
      - date_debut
      - date_fin
      - decision
      - duree_secondes
      - irrigation_id
      - statut
      - utilisateur
      - volume_ml
      - zone
    Mesure:
      type: object
      properties:
        mesure_id:
          type: integer
          readOnly: true
        mission:
          type: integer
          readOnly: true
        zone:
          type: integer
          readOnly: true
        etape:
          type: integer
          readOnly: true
        numero_point:
          type: integer
          readOnly: true
        numero_lecture:
          type: integer
          readOnly: true
        valeur_brute:
          type: integer
          readOnly: true
          nullable: true
        valeur_humidite:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        date_heure_mesure:
          type: string
          format: date-time
          readOnly: true
        statut:
          allOf:
          - $ref: '#/components/schemas/MesureStatutEnum'
          readOnly: true
        message:
          type: string
          readOnly: true
        incident:
          type: integer
          readOnly: true
          nullable: true
        analyse:
          type: integer
          readOnly: true
          nullable: true
      required:
      - analyse
      - date_heure_mesure
      - etape
      - incident
      - message
      - mesure_id
      - mission
      - numero_lecture
      - numero_point
      - statut
      - valeur_brute
      - valeur_humidite
      - zone
    MesureStatutEnum:
      enum:
      - valide
      - invalide
      - manquante
      type: string
      description: |-
        * `valide` - Valide
        * `invalide` - Invalide
        * `manquante` - Manquante
    Mission:
      type: object
      properties:
        mission_id:
          type: integer
          readOnly: true
        statut:
          allOf:
          - $ref: '#/components/schemas/MissionStatutEnum'
          readOnly: true
        date_creation:
          type: string
          format: date-time
          readOnly: true
        date_debut:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        date_fin:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        utilisateur:
          type: integer
          nullable: true
        parcelle:
          type: integer
        etapes:
          type: array
          items:
            $ref: '#/components/schemas/Etape'
      required:
      - date_creation
      - date_debut
      - date_fin
      - etapes
      - mission_id
      - parcelle
      - statut
    MissionStatutEnum:
      enum:
      - planifiee
      - en_cours
      - terminee
      - interrompue
      - non_confirmee
      type: string
      description: |-
        * `planifiee` - Planifiée
        * `en_cours` - En cours
        * `terminee` - Terminée
        * `interrompue` - Interrompue
        * `non_confirmee` - Non confirmée
    PaginatedDecisionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
    PaginatedIncidentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
    PaginatedIrrigationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Irrigation'
    PaginatedMesureList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Mesure'
    Parcelle:
      type: object
      properties:
        parcelle_id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 100
        longitude:
          type: number
          format: double
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        superficie:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        utilisateur:
          type: integer
        zones:
          type: array
          items:
            $ref: '#/components/schemas/Zone'
          readOnly: true
      required:
      - nom
      - parcelle_id
      - utilisateur
      - zones
    PatchedCulture:
      type: object
      properties:
        culture_id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 100
        variete:
          type: string
          nullable: true
          maxLength: 100
    PatchedParcelle:
      type: object
      properties:
        parcelle_id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 100
        longitude:
          type: number
          format: double
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        superficie:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        utilisateur:
          type: integer
        zones:
          type: array
          items:
            $ref: '#/components/schemas/Zone'
          readOnly: true
    PatchedUtilisateurConnecte:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        nom:
          type: string
        prenom:
          type: string
        role:
          type: string
    PatchedZone:
      type: object
      properties:
        zone_id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 100
        superficie:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        humidite_minimum:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        humidite_maximum:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        geometrie_zone:
          nullable: true
        irrigation_auto_active:
          type: boolean
        parcelle:
          type: integer
        cultures:
          type: array
          items:
            $ref: '#/components/schemas/Culture'
          readOnly: true
    Rafraichissement:
      type: object
      properties:
        rafraichissement:
          type: string
      required:
      - rafraichissement
    Statut4b1Enum:
      enum:
      - planifiee
      - en_cours
      - terminee
      - interrompue
      type: string
      description: |-
        * `planifiee` - Planifiée
        * `en_cours` - En cours
        * `terminee` - Terminée
        * `interrompue` - Interrompue
    TypeDecisionEnum:
      enum:
      - humidite_suffisante
      - humidite_insuffisante
      - mesure_invalide
      type: string
      description: |-
        * `humidite_suffisante` - Humidité suffisante
        * `humidite_insuffisante` - Humidité insuffisante
        * `mesure_invalide` - Mesure invalide
    TypeIncidentEnum:
      enum:
      - obstacle
      - capteur_defaillant
      - perte_communication
      - mesure_invalide
      type: string
      description: |-
        * `obstacle` - Obstacle
        * `capteur_defaillant` - Capteur défaillant
        * `perte_communication` - Perte de communication
        * `mesure_invalide` - Mesure invalide
    UtilisateurConnecte:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        nom:
          type: string
        prenom:
          type: string
        role:
          type: string
      required:
      - email
      - id
      - nom
      - prenom
      - role
    Zone:
      type: object
      properties:
        zone_id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 100
        superficie:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        humidite_minimum:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        humidite_maximum:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        geometrie_zone:
