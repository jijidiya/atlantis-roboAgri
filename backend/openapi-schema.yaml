openapi: 3.0.3
info:
  title: API RoboAgri-Kin
  version: 1.0.0
  description: "\n    API REST pour la gestion des parcelles, missions de robot et
    irrigation.\n\n    **Fonctionnalités**\n    - Suivi des parcelles et zones de
    culture\n    - Planification et suivi des missions du robot\n    - Collecte et
    analyse des mesures d'humidité\n    - Recommandations et interventions d'irrigation\n
    \   "
  contact:
    name: Équipe RoboAgri-Kin
    email: unniekang100@gmail.com
  license:
    name: Interne – on est juste un groupe d'etudiants.
paths:
  /api/v1/auth/connexion/:
    post:
      operationId: v1_auth_connexion_create
      description: POST /auth/connexion/ -> jetons d'accès et de rafraîchissement.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Connexion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Connexion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Connexion'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connexion'
          description: ''
  /api/v1/auth/moi/:
    get:
      operationId: v1_auth_moi_retrieve
      description: 'GET /auth/moi/ : profil courant. PATCH /auth/moi/ : modifier prenom/nom/email.'
